services:
  db:
    image: postgres:16-alpine
    container_name: pilates_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - pilates_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [pilates_net]

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pilates_backend
    restart: always
    env_file: .env
    environment:
      POSTGRES_HOST: db
    volumes:
      - pilates_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2"
    networks: [pilates_net]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pilates_frontend
    restart: always
    volumes:
      - /opt/pilates/brand:/usr/share/nginx/html/brand:ro
    depends_on:
      - backend
    networks: [pilates_net, edge]

  whatsapp:
    image: ghcr.io/aldinokemal/go-whatsapp-web-multidevice@sha256:cdfae0dda4f8a4b36a1a3214e5599a14c6d5b86912aff0574f230af5b5ebe213
    container_name: pilates_whatsapp
    restart: always
    command: rest
    environment:
      APP_PORT: "3000"
      APP_BASIC_AUTH: ${WA_BASIC_AUTH}
      APP_OS: ReformerYourBody
      TZ: ${TIMEZONE}
    ports:
      - "127.0.0.1:8057:3000"
    volumes:
      - pilates_wa:/app/storages
    networks: [pilates_net, edge]

volumes:
  pilates_pg:
  pilates_wa:
  pilates_uploads:

networks:
  pilates_net:
    name: pilates_network
  edge:
    external: true
